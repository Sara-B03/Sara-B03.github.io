<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio | Contact</title>
  <link rel="stylesheet" href="design.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
            <div class="logo-container">
              <img src="imgs\slogo.png" alt="Sara Abdulla Logo" class="navbar-logo">
            </div>
        </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="Projects.html">Projects</a></li>
          <li class="nav-item"><a class="nav-link active" href="contact.html">Contact Me</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <h1 class="fw-bold text-center">Thank you for taking the time to reach out</h1>
    <p class="lead text-center">How can I help you?</p>
  </div>


    <!-- Contact Form Section -->
    <section>
    <div class="container">
        <div class="row justify-content-center">
        <div class="col-lg-6">

            <div class="card shadow-sm p-4">
                <form action="https://formspree.io/f/xrbyzavz" method="POST">
                    <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" class="form-control" name="name" required>
                    </div>
                
                    <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" class="form-control" name="email" required>
                    </div>
                
                    <div class="mb-3">
                    <label for="message" class="form-label">Message</label>
                    <textarea class="form-control" name="message" rows="5" required></textarea>
                    </div>
                
                    <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Send Message</button>
                    </div>
                </form>              
            </div>

            <div class="contact-section">
                <ul class="contact-info">
                  <li>
                    <a href="https://www.linkedin.com/in/sara-abdulla025" target="_blank">
                      <img src="imgs/linkedin.png" alt="LinkedIn Logo">
                    </a>
                  </li>
                  <li>
                    <a href="https://github.com/Sara-B03" target="_blank">
                      <img src="imgs/github.png" alt="GitHub Logo">
                    </a>
                  </li>
                </ul>
              </div>
              
      </div>
    </div>
  </div>
</section>

<!-- Footer -->
<footer class="bg-dark text-white text-center py-3 mt-5">
  <p class="mb-0">© 2026 Sara Abdulla | Built with Bootstrap</p>
</footer>

</html>
